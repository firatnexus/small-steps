<!doctype html>
<html lang="tr" data-platform="web">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fefdfc">
  <meta name="description" content="Task list and Pomodoro timer — offline-first, 12 languages, zero dependencies.">
  <title>Small Steps — Your daily focus space</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Small Steps">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- Paylaşım önizlemesi (Open Graph / Twitter) -->
  <meta property="og:title" content="Small Steps — Your daily focus space">
  <meta property="og:description" content="Calm, offline-first task list + Pomodoro PWA. Zero dependencies, 12 languages — your data never leaves your browser.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://firatnexus.github.io/small-steps/">
  <meta property="og:image" content="https://firatnexus.github.io/small-steps/social-preview.png">
  <meta property="og:image:width" content="1280">
  <meta property="og:image:height" content="640">
  <meta property="og:image:alt" content="Small Steps — task list and Pomodoro timer">
  <meta property="og:locale" content="en_US">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://firatnexus.github.io/small-steps/">

  <link rel="stylesheet" href="style.css">
  <link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
  <!-- Açılış ekranı: uygulama hazır olunca solup kaldırılır -->
  <div id="splash" aria-hidden="true">
    <div class="splash-inner">
      <svg class="splash-logo" width="88" height="88" viewBox="0 0 96 96" aria-hidden="true" focusable="false">
        <rect class="logo-tile" width="96" height="96" rx="22"/>
        <path class="logo-mark" d="M16.5 70H32.5V56H48.5V42H64.5V28" fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
        <circle class="logo-dot" cx="77.5" cy="28" r="6.5"/>
      </svg>
      <p class="splash-name">Small Steps</p>
      <p class="splash-tag">Find your own pace</p>
    </div>
  </div>
  <main class="wrap">
    <!-- Üst bar: dil + tema + kısayollar -->
    <div class="topbar">
      <!-- Dil menüsü (v3.6.1): görünür tetikleyici + bağlı liste. Gizli <select>
           tek doğruluk kaynağı olarak kalır (değer, change olayı, yedekten geri yükleme). -->
      <div class="lang-menu" id="lang-menu">
        <select id="lang-select" class="lang-native" aria-hidden="true" tabindex="-1" hidden></select>
        <button id="lang-trigger" class="lang-select lang-trigger" type="button"
                aria-haspopup="listbox" aria-expanded="false" aria-controls="lang-list" aria-label="Language">
          <span class="lang-trigger-label" id="lang-trigger-label"></span>
        </button>
        <ul id="lang-list" class="lang-list" role="listbox" aria-label="Language" tabindex="-1" hidden></ul>
      </div>
      <a id="gh-star" class="gh-star" href="https://github.com/firatnexus/small-steps"
         target="_blank" rel="noopener" data-i18n-aria="ghStars" data-i18n-title="ghStars">
        <svg class="gh-mark" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" focusable="false"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
        <span class="gh-count" id="gh-star-count"></span>
        <svg class="gh-star-icon" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" focusable="false"><path fill="currentColor" d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.751.751 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Zm0 2.445L6.615 5.5a.75.75 0 0 1-.564.41l-3.097.45 2.24 2.184a.75.75 0 0 1 .216.664l-.528 3.084 2.769-1.456a.75.75 0 0 1 .698 0l2.77 1.456-.53-3.084a.75.75 0 0 1 .216-.664l2.24-2.183-3.096-.45a.75.75 0 0 1-.564-.41L8 2.694Z"/></svg>
      </a>
      <button class="icon-button" id="help-toggle" type="button"
              data-i18n-aria="shortcutsTitle" data-i18n-title="shortcutsTitle">?</button>
      <button class="icon-button" id="theme-toggle" type="button"
              data-i18n-aria="themeLight" data-i18n-title="themeLight">☀️</button>
    </div>

    <!-- Başlık -->
    <header>
      <div class="brand-row">
        <svg class="brand-mark" width="28" height="28" viewBox="0 0 96 96" aria-hidden="true" focusable="false">
          <rect class="logo-tile" width="96" height="96" rx="22"/>
          <path class="logo-mark" d="M16.5 70H32.5V56H48.5V42H64.5V28" fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
          <circle class="logo-dot" cx="77.5" cy="28" r="6.5"/>
        </svg>
        <p class="eyebrow" data-i18n="eyebrow"></p>
      </div>
      <h1 data-i18n="title"></h1>
      <p class="intro" data-i18n="intro"></p>
    </header>

    <div class="grid">
      <!-- ============ GÖREVLER ============ -->
      <section class="card" aria-labelledby="tasks-heading">
        <div class="card-head">
          <h2 id="tasks-heading" data-i18n="tasksHeading"></h2>
          <span class="count-badge" id="count-badge">0 / 0</span>
        </div>
        <div class="progress" aria-hidden="true">
          <div class="progress-fill" id="progress-fill"></div>
        </div>

        <form class="task-form" id="task-form" autocomplete="off">
          <label for="task-input" hidden data-i18n="taskInputLabel"></label>
          <input id="task-input" maxlength="120" enterkeyhint="done" required>
          <button class="primary" type="submit" data-i18n="add"></button>
        </form>

        <div class="search-row">
          <input id="task-search" class="search-input" type="search"
                 data-i18n-placeholder="searchPlaceholder" data-i18n-aria="searchAria"
                 aria-label="" autocomplete="off">
        </div>

        <div class="filters" id="filters" role="group">
          <button class="chip is-active" type="button" data-filter="all"    data-i18n="filterAll"></button>
          <button class="chip"           type="button" data-filter="active" data-i18n="filterActive"></button>
          <button class="chip"           type="button" data-filter="done"   data-i18n="filterDone"></button>
        </div>

        <ul class="task-list" id="task-list" aria-live="polite"></ul>
        <p class="empty" id="empty-state"></p>

        <div class="task-footer">
          <span id="task-count"></span>
          <button class="text-button" id="clear-done" type="button" data-i18n="clearDone" disabled></button>
        </div>
      </section>

      <!-- ============ ZAMANLAYICI ============ -->
      <section class="card timer-card" aria-labelledby="timer-heading">
        <h2 id="timer-heading" data-i18n="timerHeading"></h2>

        <div class="focus-task" id="focus-task" hidden>
          <span class="focus-task-label" data-i18n="focusingOn"></span>
          <span class="focus-task-name" id="focus-task-name"></span>
          <button class="icon-btn focus-clear" id="focus-task-clear" type="button"
                  data-i18n-aria="clearFocusAria" data-i18n-title="clearFocusAria">✕</button>
        </div>

        <div class="mode-chips" id="mode-chips" role="group">
          <button class="chip is-active" type="button" data-mode="focus" data-i18n="modeFocus"></button>
          <button class="chip"           type="button" data-mode="short" data-i18n="modeShort"></button>
          <button class="chip"           type="button" data-mode="long"  data-i18n="modeLong"></button>
        </div>

        <div class="timer-ring">
          <svg viewBox="0 0 224 224" aria-hidden="true">
            <circle class="ring-track" cx="112" cy="112" r="100"></circle>
            <circle class="ring-fill" id="ring-fill" cx="112" cy="112" r="100"></circle>
          </svg>
          <div class="ring-center">
            <div class="clock" id="clock" role="timer">25:00</div>
            <div class="cycle-dots" id="cycle-dots" aria-hidden="true"></div>
          </div>
        </div>

        <p class="timer-note" id="timer-note"></p>

        <div class="timer-controls">
          <button class="primary"   id="start-pause" type="button" data-i18n="start"></button>
          <button class="secondary" id="reset"       type="button" data-i18n="reset"></button>
          <button class="secondary" id="skip"        type="button" data-i18n="skip"></button>
        </div>

        <details class="settings">
          <summary data-i18n="settings"></summary>
          <div class="settings-grid">
            <label><span data-i18n="setFocus"></span>
              <input type="number" id="set-focus" min="1" max="90" step="1" inputmode="numeric"></label>
            <label><span data-i18n="setShort"></span>
              <input type="number" id="set-short" min="1" max="30" step="1" inputmode="numeric"></label>
            <label><span data-i18n="setLong"></span>
              <input type="number" id="set-long" min="1" max="60" step="1" inputmode="numeric"></label>
            <label><span data-i18n="setEvery"></span>
              <input type="number" id="set-every" min="2" max="8" step="1" inputmode="numeric"></label>
            <label class="switch"><input type="checkbox" id="set-auto"> <span data-i18n="setAuto"></span></label>
            <label class="switch"><input type="checkbox" id="set-sound"> <span data-i18n="setSound"></span></label>
          </div>
        </details>

        <details class="settings">
          <summary data-i18n="dataHeading"></summary>
          <div class="data-actions">
            <button class="secondary" id="export-data" type="button" data-i18n="exportData"></button>
            <button class="secondary" id="export-csv" type="button" data-i18n="exportCsv"
                    data-i18n-title="csvNote"></button>
            <button class="secondary" id="import-data" type="button" data-i18n="importData"></button>
            <input type="file" id="import-file" accept="application/json,.json" hidden>
            <button class="secondary" id="import-todoist" type="button" data-i18n="importTodoist"></button>
            <input type="file" id="import-todoist-file" accept=".csv,text/csv" hidden>
          </div>
        </details>

        <p class="tip" id="tip-text" data-i18n-html="tip"></p>
      </section>
    </div>

    <!-- ============ ORMAN ============ -->
    <section class="card forest-card" aria-labelledby="forest-heading">
      <div class="card-head">
        <h2 id="forest-heading" data-i18n="forestHeading"></h2>
        <span class="streak-badge" id="streak-badge" title="">
          <svg width="13" height="15" viewBox="0 0 13 15" fill="none" aria-hidden="true" focusable="false"><path d="M6.5 0C7.8 2.6 6 3.6 5.4 5c-1 2.2 1.9 2.6 1.1 5C6 12 4.4 13 3.2 14.5c3.8-.4 6.7-2.5 7.5-5.6.7-2.7-1-4.4-2.2-5.6C7.5 2.3 6.9 1.3 6.5 0Z" fill="#e8763c"/></svg>
          <span id="streak-count">0</span>
        </span>
      </div>
      <p class="forest-sub" id="forest-sub"></p>
      <div class="forest-scene" id="forest-scene">
        <div class="forest-days" id="forest-days" role="img" aria-label=""></div>
      </div>
      <div class="forest-empty" id="forest-empty" hidden>
        <svg width="36" height="36" viewBox="0 0 36 36" fill="none" aria-hidden="true" focusable="false">
          <rect x="17" y="20" width="2.6" height="11" rx="1.2" fill="currentColor" opacity=".45"/>
          <path d="M18 20c-4.4-1.1-6-4.4-4.9-8.8 3.3 1.7 4.9 4.4 4.9 8.8Zm0 0c4.4-1.1 6-4.4 4.9-8.8-3.3 1.7-4.9 4.4-4.9 8.8Z" fill="currentColor" opacity=".55"/>
        </svg>
        <span data-i18n="forestEmpty"></span>
      </div>
    </section>

    <!-- ============ İSTATİSTİK ============ -->
    <section class="card stats-card" aria-labelledby="stats-heading">
      <div class="stats-header">
        <h2 id="stats-heading" data-i18n="statsHeading"></h2>
        <span class="count-badge" id="week-badge">0</span>
      </div>

      <div class="stats-grid">
        <div class="stat-tile">
          <div class="label" data-i18n="statFocusWeek"></div>
          <div class="value">
            <span id="stat-focus-week">0</span><span class="unit" data-i18n="unitMin"></span>
          </div>
        </div>
        <div class="stat-tile">
          <div class="label" data-i18n="statTasksWeek"></div>
          <div class="value"><span id="stat-tasks-week">0</span></div>
        </div>
        <div class="stat-tile">
          <div class="label" data-i18n="statSessionsWeek"></div>
          <div class="value"><span id="stat-sessions-week">0</span></div>
        </div>
      </div>

      <div class="week-chart" id="week-chart" role="img" data-i18n-aria="weekChartAria"></div>

      <div class="heatmap-block">
        <div class="heatmap-head">
          <h3 data-i18n="heatmapHeading"></h3>
        </div>
        <div class="heatmap" id="heatmap" role="img" data-i18n-aria="heatmapAria"></div>
      </div>
    </section>

    <footer>
      <span id="stats-line"></span>
      <span data-i18n="storageNote"></span>
    </footer>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- Kısayol yardımı -->
  <dialog class="shortcuts-dialog" id="shortcuts-dialog">
    <div class="shortcuts-card">
      <div class="shortcuts-head">
        <h2 data-i18n="shortcutsTitle"></h2>
        <button class="icon-btn" id="shortcuts-close" type="button"
                data-i18n-aria="scClose" data-i18n-title="scClose">✕</button>
      </div>
      <dl class="shortcut-list">
        <dt><kbd>Space</kbd></dt><dd data-i18n="scStartPause"></dd>
        <dt><kbd>N</kbd></dt><dd data-i18n="scNew"></dd>
        <dt><kbd>?</kbd></dt><dd data-i18n="scHelp"></dd>
        <dt><kbd>Esc</kbd></dt><dd data-i18n="scClose"></dd>
      </dl>
      <p class="shortcut-hint" data-i18n="scEdit"></p>
    </div>
  </dialog>

  <!-- PWA service worker kaydı -->
  <script>
    if ("serviceWorker" in navigator && !window.Capacitor) {
      window.addEventListener("load", () => {
        const sw = navigator.serviceWorker;
        /* Tazeleme güvenli mi? Sayfa görünür durumda, çalışan zamanlayıcı yok
           ve hızlı ekleme kutusuna yazılan taslak yok (app.js sağlar). */
        const safeToReload = () =>
          document.visibilityState === "visible" &&
          (typeof window.__smallStepsSafeToReload !== "function" ||
            window.__smallStepsSafeToReload());
        /* Bu sayfa açılırken bir SW tarafından kontrol ediliyor muydu?
           İlk kurulumda (null → SW) tazelemeye gerek yok; sonraki her SW
           değişiminde (sürüm güncellemesi) sayfa bir kez tazelenir. */
        let controlledBefore = !!sw.controller;
        let refreshing = false;
        let pendingRefresh = false;
        let retryHandle = null;
        const reload = () => {
          refreshing = true;
          location.reload();
        };
        const tryPending = () => {
          if (!pendingRefresh || refreshing || !safeToReload()) return;
          reload();
        };
        sw.addEventListener("controllerchange", () => {
          const firstInstall = !controlledBefore;
          controlledBefore = !!sw.controller;
          if (firstInstall || refreshing) return;
          if (safeToReload()) { reload(); return; }
          /* Zamanlayıcı çalışıyor / taslak yazılıyor / sayfa gizli:
             tazelemeyi güvenli ana ertele (3 sn'de bir + görünür olunca). */
          pendingRefresh = true;
          if (!retryHandle) retryHandle = setInterval(tryPending, 3000);
        });
        sw.register("sw.js", { updateViaCache: "none" })
          .then((reg) => {
            /* Ön plana dönüşte ve bağlantı gelince güncelleme denetle:
               arka planda bekleyen kurulu uygulama yeni sürümü böyle fark eder
               (navigasyon olmadan da). */
            const check = () => reg.update().catch(() => {});
            document.addEventListener("visibilitychange", () => {
              if (document.visibilityState === "visible") check();
              tryPending();
            });
            window.addEventListener("online", check);
          })
          .catch((err) => console.warn("SW kaydı başarısız:", err));
      });
    }
  </script>

  <!-- Sıra önemli: önce sözlük, sonra uygulama -->
  <script src="translations.js"></script>
  <script src="app.js"></script>
</body>
</html>
