<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minik Adımlar — Testler</title>
<style>
  :root {
    color-scheme: light;
    --bg: #fefdfc; --card: #fff; --ink: #25221e; --muted: #6f6c69;
    --green: #cf3520; --green-dark: #a92a18;
    --red: #a13e3e; --red-soft: #fdeceb;
    --ok-soft: #e6f4ec; --line: #e8e7e5;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 40px 20px 80px;
    background: var(--bg);
    color: var(--ink);
    font-size: 15px; line-height: 1.55;
  }
  .wrap { width: min(100%, 780px); margin: 0 auto; }
  h1 { margin: 0 0 8px; font-size: 1.9rem; letter-spacing: -.03em; }
  .lead { color: var(--muted); margin: 0 0 24px; }

  .summary {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
    margin-bottom: 20px;
  }
  .summary > div {
    padding: 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--card);
  }
  .summary .label { font-size: .78rem; font-weight: 700; letter-spacing: .08em;
    text-transform: uppercase; color: var(--muted); }
  .summary .value { font-size: 1.6rem; font-weight: 760; letter-spacing: -.04em; margin-top: 4px; }
  .summary .value.pass { color: var(--green); }
  .summary .value.fail { color: var(--red); }

  .bar {
    height: 6px; border-radius: 999px; background: #e6ede7; overflow: hidden;
    margin: 0 0 22px;
  }
  .bar > div { height: 100%; background: var(--green); transition: width .4s ease; }

  ul.tests { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  li.test {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 10px 12px; border-radius: 10px; background: var(--card); border: 1px solid var(--line);
  }
  li.test.pass { border-color: #cfe6d6; background: var(--ok-soft); }
  li.test.fail { border-color: #e9c5c5; background: var(--red-soft); }
  .mark { flex: none; font-weight: 800; font-size: 1rem; line-height: 1.4; }
  .mark.pass { color: var(--green); }
  .mark.fail { color: var(--red); }
  .msg { flex: 1; }
  .msg .title { font-weight: 650; }
  .msg .details { font-size: .85rem; color: var(--muted); margin-top: 2px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; white-space: pre-wrap; }

  .actions { display: flex; gap: 10px; margin-top: 24px; }
  button {
    padding: 10px 16px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--card); color: var(--ink); font-weight: 650; cursor: pointer;
  }
  button:hover { background: #f7faf7; }
  button.primary { background: var(--green); color: #fff; border-color: var(--green); }
  button.primary:hover { background: var(--green-dark); }

  @media (max-width: 560px) {
    .summary { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<main class="wrap">
  <h1>🧪 Minik Adımlar — Testler</h1>
  <p class="lead">i18n motoru ve çeviri bütünlüğü için tarayıcı testleri.</p>

  <div class="summary" id="summary"></div>
  <div class="bar"><div id="bar" style="width:0%"></div></div>

  <ul class="tests" id="results"></ul>

  <div class="actions">
    <button class="primary" onclick="location.reload()">🔄 Yeniden çalıştır</button>
    <button onclick="history.length && history.back()">← Uygulamaya dön</button>
  </div>
</main>

<script src="translations.js"></script>
<script>
(() => {
  "use strict";
  const results = [];
  const { TRANSLATIONS, SUPPORTED_LANGS, t, getLang, applyLanguage, setLanguage,
          buildLangSelect, detectInitialLang } = window.i18n;

  const test = (title, fn) => {
    try {
      const out = fn();
      if (out === false) throw new Error("false döndü");
      results.push({ ok: true, title, details: typeof out === "string" ? out : "" });
    } catch (err) {
      results.push({ ok: false, title, details: err.message || String(err) });
    }
  };
  const assert = (cond, msg) => { if (!cond) throw new Error(msg || "Beklenen koşul sağlanmadı"); };
  const eq = (a, b, msg) => { if (a !== b) throw new Error(msg || `Beklenen: ${b} • Gelen: ${a}`); };

  test("translations.js yüklendi", () => {
    assert(window.i18n && typeof window.i18n === "object", "window.i18n yok");
    return "OK";
  });

  test("12 dil tanımlı", () => {
    eq(SUPPORTED_LANGS.length, 12, `Beklenen 12, gelen ${SUPPORTED_LANGS.length}`);
    return SUPPORTED_LANGS.join(", ");
  });

  test("Beklenen 12 dil kodunun tümü var", () => {
    const expected = ["en","tr","es","fr","de","pt","it","hi","ar","zh","ja","ru"];
    const missing = expected.filter(k => !SUPPORTED_LANGS.includes(k));
    assert(missing.length === 0, `Eksik: ${missing.join(", ")}`);
    return "tamam";
  });

  test("t() mevcut anahtarı döner", () => {
    applyLanguage("en");
    eq(t("add"), "Add");
    return `en.add = "Add"`;
  });

  test("t() bilinmeyen anahtarda anahtarı döner", () => {
    const v = t("__yok_boyle_anahtar__");
    eq(v, "__yok_boyle_anahtar__");
    return v;
  });

  test("t() parametreleri interpolate eder", () => {
    applyLanguage("tr");
    const v = t("count", { done: 3, total: 5 });
    assert(v.includes("3") && v.includes("5"), `Gelen: "${v}"`);
    return v;
  });

  test("Tüm dillerde 'title' anahtarı var", () => {
    const eksik = [];
    for (const code of SUPPORTED_LANGS) {
      if (!TRANSLATIONS[code].title) eksik.push(code);
    }
    assert(eksik.length === 0, `Eksik: ${eksik.join(", ")}`);
    return "tamam";
  });

  test("Tüm diller İngilizce ile aynı anahtar setine sahip", () => {
    const ref = new Set(Object.keys(TRANSLATIONS.en));
    const eksik = [];
    for (const code of SUPPORTED_LANGS) {
      for (const key of ref) {
        if (!(key in TRANSLATIONS[code])) eksik.push(`${code}.${key}`);
      }
    }
    assert(eksik.length === 0, `Eksik anahtarlar:\n${eksik.slice(0,20).join("\n")}${eksik.length>20 ? "\n…" : ""}`);
    return `${ref.size} anahtar × 12 dil = tam`;
  });

  test("Her dilde 'name' ve 'langLabel' var", () => {
    for (const code of SUPPORTED_LANGS) {
      assert(TRANSLATIONS[code].name, `${code} için name yok`);
      assert(TRANSLATIONS[code].langLabel, `${code} için langLabel yok`);
    }
    return "tamam";
  });

  test("Arapça seçildiğinde document.dir = rtl", () => {
    applyLanguage("ar");
    eq(document.documentElement.dir, "rtl");
    eq(document.documentElement.lang, "ar");
    return "ar → rtl";
  });

  test("Türkçe seçildiğinde document.dir = ltr", () => {
    applyLanguage("tr");
    eq(document.documentElement.dir, "ltr");
    return "tr → ltr";
  });

  test("buildLangSelect() 12 option üretir", () => {
    const sel = document.createElement("select");
    buildLangSelect(sel);
    eq(sel.options.length, 12);
    return `${sel.options.length} seçenek`;
  });

  test("Dil seçici seçili dili yansıtır", () => {
    setLanguage("de");
    const sel = document.createElement("select");
    buildLangSelect(sel);
    eq(sel.value, "de");
    return `de seçili`;
  });

  test("setLanguage() localStorage'a yazar", () => {
    setLanguage("fr");
    eq(localStorage.getItem("small-steps-language"), "fr");
    return "fr kaydedildi";
  });

  test("detectInitialLang() kayıtlı dili okur", () => {
    setLanguage("ja");
    eq(detectInitialLang(), "ja");
    return "ja okundu";
  });

  test("Geçersiz dil kodu reddedilir", () => {
    const before = getLang();
    setLanguage("xx");
    eq(getLang(), before, "xx kabul edildi");
    return "reddedildi";
  });

  test("Tema etiketleri tüm dillerde var", () => {
    const keys = ["themeLight", "themeDark", "themeSepia", "themeContrast"];
    const eksik = [];
    for (const code of SUPPORTED_LANGS) {
      for (const k of keys) {
        if (!TRANSLATIONS[code][k]) eksik.push(`${code}.${k}`);
      }
    }
    assert(eksik.length === 0, `Eksik: ${eksik.join(", ")}`);
    return `${keys.length} anahtar × 12 dil`;
  });

  test("İstatistik anahtarları tüm dillerde var", () => {
    const keys = ["statsHeading","statFocusWeek","statTasksWeek","statStreak","statSessionsWeek",
                  "forestHeading","forestSub","forestEmpty","forestMore","forestAria",
                  "unitMin","unitDays","weekChartAria"];
    const eksik = [];
    for (const code of SUPPORTED_LANGS) {
      for (const k of keys) {
        if (!TRANSLATIONS[code][k]) eksik.push(`${code}.${k}`);
      }
    }
    assert(eksik.length === 0, `Eksik: ${eksik.join(", ")}`);
    return `${keys.length} anahtar × 12 dil`;
  });

  test("v3.2 anahtarları tüm dillerde var", () => {
    const keys = ["repeatNone","repeatDaily","repeatWeekdays","repeatWeekly",
                  "dueToday","dueTomorrow","toastReopenBlocked",
                  "importTodoist","todoistConfirm","todoistDone","todoistInvalid"];
    const eksik = [];
    for (const code of SUPPORTED_LANGS) {
      for (const k of keys) {
        if (!TRANSLATIONS[code][k]) eksik.push(`${code}.${k}`);
      }
    }
    assert(eksik.length === 0, `Eksik: ${eksik.join(", ")}`);
    return `${keys.length} anahtar × 12 dil`;
  });

  test("v3.1 anahtarları tüm dillerde var", () => {
    const keys = ["subtaskAdd","subtaskPlaceholder","subtaskAria","subtaskProgress",
                  "exportCsv","csvNote","toastDeletedTree"];
    const eksik = [];
    for (const code of SUPPORTED_LANGS) {
      for (const k of keys) {
        if (!TRANSLATIONS[code][k]) eksik.push(`${code}.${k}`);
      }
    }
    assert(eksik.length === 0, `Eksik: ${eksik.join(", ")}`);
    return `${keys.length} anahtar × 12 dil`;
  });

  test("v3 anahtarları tüm dillerde var", () => {
    const keys = ["searchPlaceholder","prioNone","prioLow","prioMed","prioHigh",
                  "focusBtnAria","focusingOn","clearFocusAria","emptySearch",
                  "heatmapHeading","heatmapAria","dataHeading","exportData","importData",
                  "importDone","importInvalid","importConfirm","shortcutsTitle",
                  "scStartPause","scNew","scHelp","scEdit","scClose"];
    const eksik = [];
    for (const code of SUPPORTED_LANGS) {
      for (const k of keys) {
        if (!TRANSLATIONS[code][k]) eksik.push(`${code}.${k}`);
      }
    }
    assert(eksik.length === 0, `Eksik: ${eksik.join(", ")}`);
    return `${keys.length} anahtar × 12 dil`;
  });

  test("Placeholder'lar tüm dillerde aynı", () => {
    const ph = (s) => (String(s).match(/\{(\w+)\}/g) || []).sort().join(",");
    const uyusmayan = [];
    for (const key of Object.keys(TRANSLATIONS.en)) {
      const ref = ph(TRANSLATIONS.en[key]);
      for (const code of SUPPORTED_LANGS) {
        if (code === "en") continue;
        if (ph(TRANSLATIONS[code][key]) !== ref) uyusmayan.push(`${code}.${key}`);
      }
    }
    assert(uyusmayan.length === 0, `Uyuşmayan: ${uyusmayan.slice(0, 10).join(", ")}`);
    return "tüm placeholder setleri eşit";
  });

  test("Hiçbir çeviride boş string yok", () => {
    const bos = [];
    for (const code of SUPPORTED_LANGS) {
      for (const [k, v] of Object.entries(TRANSLATIONS[code])) {
        if (typeof v === "string" && v.trim() === "") bos.push(`${code}.${k}`);
      }
    }
    assert(bos.length === 0, `Boş: ${bos.join(", ")}`);
    return "tamam";
  });

  const pass = results.filter(r => r.ok).length;
  const fail = results.length - pass;
  const pct = results.length ? Math.round((pass / results.length) * 100) : 0;

  document.querySelector("#summary").innerHTML = `
    <div><div class="label">Toplam</div><div class="value">${results.length}</div></div>
    <div><div class="label">Geçti</div><div class="value pass">${pass}</div></div>
    <div><div class="label">Başarısız</div><div class="value ${fail ? "fail" : ""}">${fail}</div></div>
  `;
  document.querySelector("#bar").style.width = pct + "%";

  document.querySelector("#results").innerHTML = results.map(r => `
    <li class="test ${r.ok ? "pass" : "fail"}">
      <span class="mark ${r.ok ? "pass" : "fail"}">${r.ok ? "✓" : "✗"}</span>
      <div class="msg">
        <div class="title">${r.title}</div>
        ${r.details ? `<div class="details">${r.details.replace(/</g, "&lt;")}</div>` : ""}
      </div>
    </li>
  `).join("");

  document.title = `${fail ? "❌" : "✅"} Testler — ${pass}/${results.length}`;

  applyLanguage(detectInitialLang());
})();
</script>
</body>
</html>
